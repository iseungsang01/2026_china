<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 베이징 · 내몽고 가족여행</title>
<style>
  :root{
    --bg:#0D1117; --surface:#161B22; --pop:#1C2128; --modal:#21262D;
    --border:#30363D; --border-hi:#484F58;
    --ink:#E6EDF3; --muted:#8B949E; --dim:#6E7681;
    --primary:#2F81F7; --link:#58A6FF;
    --green:#238636; --success:#3FB950; --warn:#D29922; --error:#F85149;
    --active:#F78166;
    --rail:#2F81F7; --road:#D29922;
    --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Malgun Gothic", sans-serif;
    --fm: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    --mapfilter: brightness(.92) saturate(.88) contrast(1.02);
    --lblink:#0D1117; --lblsub:#30363D; --lblhalo:#fff;
  }
  /* 라이트 모드 — Octo Code는 다크 우선이므로 이쪽이 보조 팔레트 */
  :root[data-theme="light"]{
    --bg:#FFFFFF; --surface:#F6F8FA; --pop:#FFFFFF; --modal:#FFFFFF;
    --border:#D0D7DE; --border-hi:#AFB8C1;
    --ink:#1F2328; --muted:#656D76; --dim:#8C959F;
    --primary:#0969DA; --link:#0969DA;
    --green:#1F883D; --success:#1A7F37; --warn:#9A6700; --error:#CF222E;
    --active:#FD8C73;
    --rail:#0969DA; --road:#9A6700;
    --mapfilter:none;
  }
  :root[data-theme="light"] .scrim{background:rgba(31,35,40,.5)}
  :root[data-theme="light"] .poicard,
  :root[data-theme="light"] .sheet{box-shadow:0 8px 24px rgba(31,35,40,.15)}
  :root[data-theme="light"] .attrib{background:rgba(255,255,255,.85); color:#656D76}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:var(--f); font-size:14px; line-height:1.55; font-weight:400}
  button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
  b,strong{font-weight:600}
  .app{display:flex; height:100vh; height:100dvh}

  /* ============ SIDEBAR ============ */
  .side{flex:0 0 264px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow-y:auto; z-index:30}
  .brand{padding:16px; border-bottom:1px solid var(--border)}
  .brand h1{margin:0 0 4px; font-size:16px; font-weight:600; letter-spacing:-.02em}
  .brand p{margin:0; font-size:12px; color:var(--muted); font-family:var(--fm)}
  .brand .meta{display:flex; gap:4px; margin-top:12px; flex-wrap:wrap}
  .brand .meta span{font-size:12px; background:var(--pop); border:1px solid var(--border);
    padding:2px 10px; border-radius:9999px; color:var(--muted); font-weight:500}
  .grp{padding:12px 8px 4px}
  .grp-t{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim);
    padding:0 8px 8px; font-weight:600}
  .navbtn{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:8px 12px; border-radius:6px; margin-bottom:1px; transition:background .12s;
    border-left:2px solid transparent}
  .navbtn:hover{background:var(--pop)}
  .navbtn .dot{flex:0 0 8px; height:8px; border-radius:9999px}
  .navbtn .tx{flex:1; min-width:0}
  .navbtn .tx b{display:block; font-size:14px; font-weight:500; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .navbtn .tx s{display:block; font-size:12px; color:var(--muted); text-decoration:none;
    font-family:var(--fm)}
  .navbtn .warnmark{flex:0 0 auto; font-size:12px; color:var(--error); font-weight:600}
  .opts{padding:8px; border-top:1px solid var(--border); margin-top:auto}
  .cbtn{display:block; width:100%; text-align:left; padding:8px 10px; border-radius:6px;
    border:1px solid var(--border); margin-bottom:4px;
    transition:border-color .12s, background .12s}
  .cbtn:hover{border-color:var(--border-hi)}
  .cbtn b{display:block; font-size:13px; font-weight:500}
  .cbtn s{display:block; font-size:12px; color:var(--muted); text-decoration:none;
    margin-top:1px; font-family:var(--fm)}
  .cbtn.on{border-color:var(--primary); background:rgba(47,129,247,.10)}
  .cbtn .rec{font-size:11px; background:var(--green); color:#fff; font-weight:500;
    padding:1px 6px; border-radius:9999px; margin-left:6px}
  .cbtn .yours{font-size:11px; background:var(--active); color:#1a1005; font-weight:600;
    padding:1px 6px; border-radius:9999px; margin-left:6px}

  /* ============ MAP ============ */
  .stage{flex:1; position:relative; overflow:hidden; background:var(--bg)}
  svg#map{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
  svg#map.grabbing{cursor:grabbing}
  #tiles{filter:var(--mapfilter)}
  #cam{transition:transform .5s cubic-bezier(.4,0,.2,1)}
  #cam.nofx{transition:none}
  .poi{cursor:pointer}
  .poi circle.hit{fill:transparent}
  .poi .ring{fill:none; stroke:#fff; stroke-width:2.5}
  .poi .halo{fill:none; stroke:var(--primary); stroke-width:0; opacity:0; transition:.12s}
  .poi:hover .halo{stroke-width:2.5; opacity:.7}
  .poi.active .halo{stroke-width:3; opacity:1}
  .mlbl{font-size:15px; font-weight:600; fill:#0D1117; stroke:#fff; stroke-width:3.6;
    paint-order:stroke; pointer-events:none; letter-spacing:-.01em}
  .mlbl-s{font-size:11px; font-weight:500; fill:#30363D; stroke:#fff; stroke-width:2.8;
    paint-order:stroke; pointer-events:none}
  .mnight{font-size:11px; font-weight:600; stroke:#fff; stroke-width:2.8;
    paint-order:stroke; pointer-events:none}
  .dur{font-size:11.5px; font-weight:600; stroke:#fff; stroke-width:3; paint-order:stroke;
    pointer-events:none; font-family:var(--fm)}
  .dur-r{fill:#1155c4} .dur-c{fill:#9a6b0c}
  .rail-line{stroke:var(--rail); stroke-width:3.4; fill:none; stroke-linecap:round}
  .rail-case{stroke:#fff; stroke-width:6.6; fill:none; stroke-linecap:round; opacity:.9}
  .road-line{stroke:var(--road); stroke-width:2.8; fill:none; stroke-dasharray:8 6;
    stroke-linecap:round}
  .road-case{stroke:#fff; stroke-width:5.8; fill:none; stroke-linecap:round; opacity:.85}
  /* 줌 배율(--z)에 맞춰 선·글자·마커를 역보정해 화면상 크기를 일정하게 유지 */
  @property --z{syntax:"<number>"; initial-value:1; inherits:true}
  .rail-line,.rail-case,.road-line,.road-case,.poi .ring,.poi .halo,
  .mlbl,.mlbl-s,.mnight,.dur{vector-effect:non-scaling-stroke}
  .mlbl{font-size:calc(15px / var(--z))}
  .mlbl-s{font-size:calc(11px / var(--z))}
  .mnight{font-size:calc(11px / var(--z))}
  .dur{font-size:calc(11.5px / var(--z))}
  .poi .ring{r:calc(8px / var(--z))}
  .poi .halo{r:calc(16px / var(--z))}
  .poi .hit{r:calc(28px / var(--z))}
  .hud{position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:12}
  .hudbtn{background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:6px 16px; font-size:12px; font-weight:500; height:32px; transition:background .12s}
  .hudbtn:hover{background:var(--pop); border-color:var(--border-hi)}
  .hudbtn.sq{width:32px; padding:0; text-align:center; font-size:15px; line-height:1}
  .hudbtn:disabled{opacity:.4; cursor:default}
  .hint{position:absolute; left:50%; transform:translateX(-50%); bottom:16px; z-index:11;
    background:var(--surface); border:1px solid var(--border); border-radius:9999px;
    padding:4px 16px; font-size:12px; color:var(--muted); transition:opacity .12s;
    pointer-events:none}
  .attrib{position:absolute; bottom:4px; right:8px; font-size:11px; color:#30363D;
    background:rgba(255,255,255,.7); padding:1px 6px; border-radius:3px; z-index:10}
  .menubtn{display:none}

  /* ============ POI CARD ============ */
  .poicard{position:absolute; left:16px; bottom:16px; width:min(384px,calc(100% - 32px));
    max-height:min(76%,580px); overflow-y:auto; z-index:20;
    background:var(--pop); border:1px solid var(--border); border-radius:6px;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .12s, transform .12s}
  .poicard.show{opacity:1; transform:none; pointer-events:auto}
  .pc-h{padding:16px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:var(--pop)}
  .pc-h .kick{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase}
  .pc-h h2{margin:4px 0 2px; font-size:20px; font-weight:600; letter-spacing:-.02em}
  .pc-h .cn{font-size:12px; color:var(--muted); font-family:var(--fm)}
  .pc-h .when{margin-top:8px; font-size:12px; color:var(--muted); background:var(--modal);
    border:1px solid var(--border); display:inline-block; padding:2px 10px;
    border-radius:9999px; font-family:var(--fm)}
  .pc-x{position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:6px;
    font-size:16px; color:var(--muted); line-height:1; transition:background .12s}
  .pc-x:hover{background:var(--modal); color:var(--ink)}
  .pc-b{padding:8px 16px 16px}
  .todo{list-style:none; margin:0; padding:0}
  .todo li{padding:8px 0; border-bottom:1px solid var(--border); font-size:14px}
  .todo li:last-child{border-bottom:0}
  .pc-note{margin-top:12px; padding:12px; border-radius:6px; font-size:12px;
    background:var(--modal); border:1px solid var(--border); border-left:2px solid var(--muted)}
  .pc-note.warn{border-left-color:var(--warn)} .pc-note.bad{border-left-color:var(--error)}
  .pc-note.ok{border-left-color:var(--success)}
  .pc-note b{display:block; margin-bottom:2px; font-weight:600}

  /* ============ SHEET ============ */
  .scrim{position:fixed; inset:0; background:rgba(1,4,9,.8); z-index:40; opacity:0;
    pointer-events:none; transition:opacity .12s}
  .scrim.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; z-index:50; left:50%; top:50%; width:min(680px,calc(100vw - 32px));
    max-height:min(84vh,780px); overflow:hidden; display:flex; flex-direction:column;
    background:var(--modal); border:1px solid var(--border); border-radius:6px;
    transform:translate(-50%,-48%); opacity:0; pointer-events:none;
    transition:opacity .12s, transform .12s}
  .sheet.show{opacity:1; transform:translate(-50%,-50%); pointer-events:auto}
  .sh-h{display:flex; align-items:center; gap:12px; padding:16px;
    border-bottom:1px solid var(--border); background:var(--surface)}
  .sh-h h2{margin:0; font-size:16px; font-weight:600; flex:1}
  .sh-h .x{width:28px; height:28px; border-radius:6px; color:var(--muted); font-size:16px;
    transition:background .12s}
  .sh-h .x:hover{background:var(--modal); color:var(--ink)}
  .sh-b{padding:16px; overflow-y:auto}
  .sh-b h3{font-size:16px; font-weight:600; margin:24px 0 8px}
  .sh-b h3:first-child{margin-top:0}
  .sh-b p{margin:8px 0; font-size:14px}
  .lead{color:var(--muted); font-size:13px; margin-top:0}
  .msg{border:1px solid var(--border); border-left:2px solid var(--muted);
    background:var(--surface); padding:12px; border-radius:6px; margin:12px 0; font-size:13px}
  .msg.bad{border-left-color:var(--error)} .msg.warn{border-left-color:var(--warn)}
  .msg.ok{border-left-color:var(--success)}
  .msg p{margin:6px 0} .msg p:first-child{margin-top:0} .msg p:last-child{margin-bottom:0}
  .tw{overflow-x:auto; margin:12px 0; border:1px solid var(--border); border-radius:6px}
  table{border-collapse:collapse; width:100%; min-width:420px; font-size:13px}
  th,td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:0}
  th{background:var(--surface); font-weight:600; white-space:nowrap; color:var(--muted)}
  td.n{text-align:right; font-family:var(--fm); white-space:nowrap}
  tr.tot td{font-weight:600; background:var(--surface)}
  .est{font-size:11px; font-weight:500; color:var(--warn); border:1px solid var(--warn);
    padding:0 5px; border-radius:3px; margin-left:6px; font-family:var(--f)}
  .ok-i{color:var(--success); font-weight:600} .no-i{color:var(--error); font-weight:600}
  .tl{list-style:none; padding:0; margin:0}
  .tl>li{padding:12px 0; border-bottom:1px solid var(--border)}
  .tl>li:last-child{border-bottom:0}
  .tl .dh{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .tl .dh b{font-size:14px; font-weight:600}
  .tl .dh s{text-decoration:none; color:var(--muted); font-size:13px}
  .tl .dh em{margin-left:auto; font-style:normal; font-size:12px; color:var(--muted);
    border:1px solid var(--border); padding:1px 10px; border-radius:9999px; font-family:var(--fm)}
  .tl ul{list-style:none; padding:0; margin:0}
  .tl ul li{display:flex; gap:12px; padding:4px 0; font-size:13px}
  .tl ul li i{flex:0 0 48px; font-style:normal; color:var(--muted); font-family:var(--fm);
    font-size:12px}
  .tag{display:inline-block; font-size:11px; font-weight:500; padding:1px 7px;
    border-radius:3px; margin-right:6px}
  .tag.r{background:rgba(47,129,247,.18); color:var(--link)}
  .tag.c{background:rgba(210,153,34,.18); color:var(--warn)}
  .tag.a{background:rgba(63,185,80,.16); color:var(--success)}
  .tag.s{background:rgba(247,129,102,.18); color:var(--active)}
  .tag.n{background:var(--modal); color:var(--muted)}
  .cn{color:var(--muted); font-family:var(--fm); font-size:.92em}
  .pri{margin:0 0 24px}
  .pri-h{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px;
    font-weight:600; font-size:13px; margin-bottom:8px; border:1px solid var(--border)}
  .pri-h .lv{font-size:11px; font-weight:600; padding:1px 8px; border-radius:9999px;
    background:rgba(255,255,255,.1)}
  .pri-h.h{background:rgba(248,81,73,.12); color:var(--error); border-color:rgba(248,81,73,.3)}
  .pri-h.m{background:rgba(210,153,34,.12); color:var(--warn); border-color:rgba(210,153,34,.3)}
  .pri-h.l{background:var(--surface); color:var(--muted)}
  .pri ol{list-style:none; padding:0; margin:0; counter-reset:p}
  .pri ol li{position:relative; padding:10px 0 10px 32px; border-bottom:1px solid var(--border);
    font-size:13px; counter-increment:p}
  .pri ol li:last-child{border-bottom:0}
  .pri ol li::before{content:counter(p); position:absolute; left:0; top:10px; width:22px;
    height:22px; border-radius:3px; font-size:11px; font-weight:600; display:flex;
    align-items:center; justify-content:center; background:var(--surface);
    border:1px solid var(--border); color:var(--muted); font-family:var(--fm)}
  .pri ol li b{display:block; margin-bottom:2px}
  .pri ol li span{color:var(--muted)}
  ol.qs{padding-left:20px; margin:0} ol.qs li{padding:6px 0; font-size:13px}
  .src{font-size:12px; color:var(--dim); margin-top:24px; padding-top:12px;
    border-top:1px solid var(--border)}

  /* 줌 단계별 세부 지점: k>=3 관문, k>=6.5 시내 상세 */
  .det{opacity:0; pointer-events:none; transition:opacity .18s}
  svg.zmid .d-mid{opacity:1; pointer-events:auto}
  svg.zfine .d-fine{opacity:1; pointer-events:auto}
  .dpt{fill:#fff; stroke:#30363D; stroke-width:1.6; vector-effect:non-scaling-stroke}
  .dpt.air{fill:#2F81F7} .dpt.rail{fill:#F78166} .dpt.wall{fill:#8250DF}
  .dpt.spot{fill:#3FB950}
  .dlbl{font-size:calc(10.5px / var(--z)); font-weight:600; fill:#0D1117; stroke:#fff;
    stroke-width:2.4; paint-order:stroke; vector-effect:non-scaling-stroke; pointer-events:none}
  .dlnk{stroke:#57606A; stroke-width:1.4; fill:none; stroke-dasharray:3 3;
    vector-effect:non-scaling-stroke; opacity:.75}
  .dleader{stroke:#8B949E; stroke-width:1; vector-effect:non-scaling-stroke; opacity:.6}
  /* ===== 시간 격자 ===== */
  .tgwrap{overflow-x:auto; margin:12px 0; border:1px solid var(--border); border-radius:6px}
  .tg{display:flex; min-width:620px; background:var(--border); gap:1px}
  .tgc{background:var(--bg); display:flex; flex-direction:column}
  .tgc.axis{flex:0 0 44px}
  .tgc.day{flex:1 1 0; min-width:104px}
  .tgh{background:var(--surface); padding:6px 4px; text-align:center;
       border-bottom:1px solid var(--border); height:46px}
  .tgh b{display:block; font-size:12px; font-weight:600}
  .tgh s{display:block; font-size:10px; color:var(--muted); text-decoration:none;
         font-family:var(--fm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tgb{position:relative; height:680px}
  .tgb .hr{position:absolute; left:0; right:0; border-top:1px solid var(--border); opacity:.55}
  .tgb .hr.day6{opacity:.9}
  .axis .tgb i{position:absolute; right:5px; font-size:10px; color:var(--dim);
       font-family:var(--fm); font-style:normal; transform:translateY(-50%)}
  .blk{position:absolute; left:2px; right:2px; border-radius:3px; padding:2px 4px;
       font-size:10px; line-height:1.22; overflow:hidden; border-left:2px solid;
       background:var(--surface)}
  .blk em{display:block; font-style:normal; font-family:var(--fm); font-size:9px;
          color:var(--muted)}
  .blk.car{border-left-color:var(--warn); background:rgba(210,153,34,.13)}
  .blk.rail{border-left-color:var(--primary); background:rgba(47,129,247,.13)}
  .blk.activity{border-left-color:var(--success); background:rgba(63,185,80,.12)}
  .blk.meal{border-left-color:var(--muted); background:rgba(139,148,158,.12)}
  .blk.rest,.blk.transit{border-left-color:var(--dim); background:rgba(110,118,129,.10)}
  .tgleg{display:flex; gap:12px; flex-wrap:wrap; padding:8px 10px; font-size:11px;
         color:var(--muted); border-top:1px solid var(--border); background:var(--surface)}
  .tgleg span{display:flex; align-items:center; gap:5px}
  .tgleg i{width:10px; height:10px; border-radius:2px; display:inline-block}
  @media (max-width:820px){
    .app{flex-direction:column}
    .menubtn{display:block; position:absolute; top:16px; left:16px; z-index:13;
      background:var(--surface); border:1px solid var(--border); border-radius:6px;
      padding:6px 16px; font-size:12px; font-weight:500; height:32px}
    .side{position:fixed; inset:0 auto 0 0; width:min(288px,85vw); flex:none;
      transform:translateX(-102%); transition:transform .12s}
    .side.open{transform:none}
    .poicard{left:12px; right:12px; bottom:12px; width:auto; max-height:58%}
    .hint{bottom:12px}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="side">
    <div class="brand">
      <h1>베이징 · 내몽고 가족여행</h1>
      <p>2026-08-10 — 08-14 · 4박 5일</p>
      <div class="meta"><span>성인 4인</span><span>고속철 1등석</span><span>렌터카 없음</span></div>
    </div>

    <div class="grp">
      <div class="grp-t">지도에서 보기</div>
      <button class="navbtn" onclick="go('beijing')"><span class="dot" style="background:#E6EDF3"></span>
        <span class="tx"><b>베이징</b><s id="s-beijing"></s></span></button>
      <button class="navbtn" onclick="go('hohhot')"><span class="dot" style="background:#8B949E"></span>
        <span class="tx"><b>후허하오터</b><s id="s-hohhot"></s></span></button>
      <button class="navbtn" id="nav-grass" onclick="go('grass')"><span class="dot" style="background:#3FB950"></span>
        <span class="tx"><b>시라무런 초원</b><s id="s-grass"></s></span></button>
      <button class="navbtn" onclick="go('desert')"><span class="dot" style="background:#D29922"></span>
        <span class="tx"><b>샹사완 사막</b><s id="s-desert"></s></span></button>
      <button class="navbtn" id="nav-baotou" onclick="go('baotou')"><span class="dot" style="background:#8B949E"></span>
        <span class="tx"><b>바오터우</b><s>B경로 전용 · 출발역</s></span></button>
    </div>

    <div class="grp">
      <div class="grp-t">자세히</div>
      <button class="navbtn" onclick="open_('plans')"><span class="dot" style="background:#F78166"></span>

var cam=document.getElementById('cam'), map=document.getElementById('map'),
    pc=document.getElementById('pc'), hint=document.getElementById('hint');
var CX=640, CY=384, MW=1280, MH=768;

/* ============ 뷰포트: 드래그 이동 + 휠/핀치 확대축소 ============ */
var MINK=1, MAXK=11;                 // 축소 하한 = 전체 보기, 확대 상한 = 11배
var view={k:1,tx:0,ty:0}, dragged=false;

function clampView(){
  view.k=Math.min(MAXK,Math.max(MINK,view.k));
  view.tx=Math.min(0,Math.max(MW-MW*view.k,view.tx));   // 지도 밖으로 못 나가게
  view.ty=Math.min(0,Math.max(MH-MH*view.k,view.ty));
}
function applyView(anim){
  clampView();
  cam.classList.toggle('nofx',!anim);
  cam.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.k+')';
  map.style.setProperty('--z',view.k);
  map.classList.toggle('zmid', view.k>=3);      // 공항·역·만리장성
  map.classList.toggle('zfine', view.k>=6.5);   // 베이징 시내 상세
  document.querySelector('.hud .sq').disabled = view.k>=MAXK-1e-6;
  document.querySelectorAll('.hud .sq')[1].disabled = view.k<=MINK+1e-6;
}
function fit(){                      // 화면 px -> SVG 단위 배율 (preserveAspectRatio=meet)
  var r=map.getBoundingClientRect();
  return Math.min(r.width/MW, r.height/MH);
}
function toSvg(cx,cy){               // 화면 좌표 -> 변환 전 SVG 좌표
  var r=map.getBoundingClientRect(), s=fit();
  return {x:(cx-r.left-(r.width-MW*s)/2)/s, y:(cy-r.top-(r.height-MH*s)/2)/s};
}
function zoomAt(px,py,nk){           // (px,py)를 고정점으로 잡고 배율만 변경
  nk=Math.min(MAXK,Math.max(MINK,nk));
  var ox=(px-view.tx)/view.k, oy=(py-view.ty)/view.k;
  view.k=nk; view.tx=px-ox*nk; view.ty=py-oy*nk;
}
function zoomStep(f){ zoomAt(CX,CY,view.k*f); applyView(true); }

var pts={}, npt=0, last=null, pinch=null;
map.addEventListener('pointerdown',function(e){
  pts[e.pointerId]={x:e.clientX,y:e.clientY}; npt++;
  map.setPointerCapture(e.pointerId);
  if(npt===1){ last={x:e.clientX,y:e.clientY}; dragged=false; map.classList.add('grabbing'); }
  else if(npt===2){ var k=Object.keys(pts); pinch={d:pdist(),k:view.k}; last=null; }
});
map.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId]) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(npt>=2 && pinch){
    var nd=pdist(); if(!nd) return;
    var c=pmid(), p=toSvg(c.x,c.y);
    zoomAt(p.x,p.y,pinch.k*nd/pinch.d);
    dragged=true; applyView(false);
  } else if(last){
    var s=fit(), dx=(e.clientX-last.x)/s, dy=(e.clientY-last.y)/s;
    if(Math.abs(e.clientX-last.x)+Math.abs(e.clientY-last.y)>3) dragged=true;
    view.tx+=dx; view.ty+=dy; last={x:e.clientX,y:e.clientY};
    applyView(false);
  }
});
function endPt(e){
  if(!pts[e.pointerId]) return;
  delete pts[e.pointerId]; npt=Math.max(0,npt-1);
  if(npt<2) pinch=null;
  if(npt===0){ last=null; map.classList.remove('grabbing');
    setTimeout(function(){dragged=false},0); }        // 드래그 직후 클릭 오작동 방지
  else { var id=Object.keys(pts)[0]; last={x:pts[id].x,y:pts[id].y}; }
}
map.addEventListener('pointerup',endPt);
map.addEventListener('pointercancel',endPt);
function pdist(){var k=Object.keys(pts); if(k.length<2) return 0;
  return Math.hypot(pts[k[0]].x-pts[k[1]].x, pts[k[0]].y-pts[k[1]].y)}
function pmid(){var k=Object.keys(pts);
  return {x:(pts[k[0]].x+pts[k[1]].x)/2, y:(pts[k[0]].y+pts[k[1]].y)/2}}

map.addEventListener('wheel',function(e){
  e.preventDefault();
  var p=toSvg(e.clientX,e.clientY);
  zoomAt(p.x,p.y, view.k*(e.deltaY<0?1.18:1/1.18));
  applyView(false);
},{passive:false});
map.addEventListener('dblclick',function(e){
  var p=toSvg(e.clientX,e.clientY); zoomAt(p.x,p.y,view.k*1.8); applyView(true);
});

function go(id){
  if(dragged) return;                       // 지도를 끌던 손짓이 클릭으로 새지 않게
  var p=POI()[id]; if(!p) return; cur=id;
  view.k=p.k; view.tx=CX-p.k*p.x; view.ty=CY-p.k*p.y;
  applyView(true); hint.style.opacity='0';
  document.querySelectorAll('.poi').forEach(function(e){e.classList.remove('active')});
  var el=document.getElementById('poi-'+id); if(el) el.classList.add('active');
  var k=document.getElementById('pc-kick');
  k.textContent=p.kick; k.style.color=p.color;
  document.getElementById('pc-title').textContent=p.title;
  document.getElementById('pc-cn').textContent=p.cn;
  document.getElementById('pc-when').textContent=p.when;
  document.getElementById('pc-list').innerHTML=p.list.map(function(r){return '<li>'+r+'</li>'}).join('');
  document.getElementById('pc-notes').innerHTML=(p.notes||[]).map(function(n){
    return '<div class="pc-note '+n[0]+'"><b>'+n[1]+'</b>'+n[2]+'</div>'}).join('');
  pc.classList.add('show');
  if(innerWidth<=820) document.getElementById('side').classList.remove('open');
}
function reset(){
  cur=null; view={k:1,tx:0,ty:0}; applyView(true);
  pc.classList.remove('show'); hint.style.opacity='1';
  document.querySelectorAll('.poi').forEach(function(e){e.classList.remove('active')});
}
function setCase(c,silent){
  CASE=c; var a=c==='a';
  document.getElementById('rt-a').hidden=!a;
  document.getElementById('rt-b').hidden=a;
  document.getElementById('cb-a').classList.toggle('on',a);
  document.getElementById('cb-b').classList.toggle('on',!a);
  document.getElementById('poi-baotou').style.opacity=a?'.45':'1';
  document.getElementById('nav-baotou').style.opacity=a?'.5':'1';
  refresh();
  if(!silent) open_('sch');
}
function setOrder(o,silent){
  ORDER=o;
  [1,2,3].forEach(function(i){document.getElementById('ob-'+i).classList.toggle('on',i===o)});
  var n=NIGHTS[o];
  document.getElementById('s-beijing').textContent=n.beijing;
  document.getElementById('s-hohhot').textContent=n.hohhot;
  document.getElementById('s-grass').textContent=n.grass;
  document.getElementById('s-desert').textContent=n.desert;
  document.getElementById('mn-grass').textContent = o===3 ? '반나절 경유' : '게르 1박';
  document.getElementById('mn-desert').textContent = o===3 ? '낙타 1박' : '낙타 · 별 1박';
  document.getElementById('nav-grass').style.opacity = o===3 ? '.6' : '1';
  refresh();
  if(!silent) open_('sch');          // 안을 고르면 그 안의 시간표를 바로 보여준다
}
function refresh(){ if(cur) go(cur); if(curSheet) open_(curSheet); }
document.querySelectorAll('.poi').forEach(function(e){

  for(var i=0;i<t.length;i++){
    var d=t[i], body='';
    for(var m2=T0;m2<=T1;m2+=60) body+='<div class="hr" style="top:'+((m2-T0)*PX)+'px"></div>';
    for(var j=0;j<d.b.length;j++){
      var b=d.b[j], top=(b[0]-T0)*PX, hgt=Math.max(13,b[1]*PX-2);
      if(b[0]+b[1]<T0||b[0]>T1) continue;
      var txt=b[3].replace(/<[^>]+>/g,'');
      body+='<div class="blk '+b[2]+'" style="top:'+top+'px;height:'+hgt+'px" title="'+
            hm(b[0])+'–'+hm(b[0]+b[1])+'  '+txt+'">'+
            (hgt>=26?'<em>'+hm(b[0])+'</em>':'')+txt+'</div>';
    }
    cols+='<div class="tgc day"><div class="tgh"><b>'+d.d+'</b><s>'+
          (d.stay||'출국')+'</s></div><div class="tgb">'+body+'</div></div>';
  }

  var head = ORDER===2
   ? '<div class="msg ok"><p><b>순서 2 · 내몽고 직행</b> — 도착 당일 곧장 후허하오터로 넘어가 <b>내몽고 3박</b>을 확보합니다. '+
     '8/11 아침부터 초원을 온전히 씁니다.</p><p><b>조건: 8/10 16:30 이전 도착.</b></p></div>'
   : ORDER===1
   ? '<div class="msg"><p><b>순서 1 · 베이징 먼저</b> — 항공 도착 시각과 무관하게 안전합니다. '+
     '대신 <b>8/11 06:00 기상</b>에 오전을 통째로 이동에 씁니다.</p></div>'
   : '<div class="msg warn"><p><b>순서 3 · 만리장성</b> — 8/13을 만리장성에 쓰는 대신 '+
     '<b>유성우 극대기와 초원 게르를 포기</b>합니다. 초원을 경유하는 변형은 검증에서 탈락해 제외했습니다.</p></div>';

  return head+
   '<div class="tgwrap"><div class="tg">'+axis+cols+'</div>'+
   '<div class="tgleg">'+
   '<span><i style="background:rgba(47,129,247,.6)"></i>고속철</span>'+
   '<span><i style="background:rgba(210,153,34,.6)"></i>차량</span>'+
   '<span><i style="background:rgba(63,185,80,.6)"></i>체험·관광</span>'+
   '<span><i style="background:rgba(139,148,158,.6)"></i>식사</span>'+
   '<span><i style="background:rgba(110,118,129,.5)"></i>수속·휴식</span>'+
   '<span>블록에 마우스를 올리면 정확한 시각이 나옵니다</span></div></div>'+
   '<p class="src">세로축은 06:00부터 다음날 02:00까지입니다. 유성우 관측처럼 자정을 넘기는 일정은 '+
   '24:00 아래에 이어집니다. 숙박은 날짜 머리말에 표시했습니다. '+
   '모든 이동은 <b>보수치</b>(최대 소요)로 배치했고 8/10 도착은 15:00 가정입니다.</p>'}},

 verify:{title:"동선 검증",body:function(){return ''+

  '<tr><td>순서 2 · B경로 <span class="cn">(배제)</span></td><td class="n">1</td>'+

 book:{title:"항목별 추천",body:function(){return ''+
  '<p class="lead">비용표의 각 항목을 실제로 무엇으로 채울지 정리했습니다. 가격은 2026년 7월 조회 기준이며 성수기 변동이 큽니다.</p>'+

  '<h3>1. 전세차는 무엇이고 왜 뺐는가</h3>'+
  '<p class="lead">「렌터카와 뭐가 다른가, 패키지와도 다를 게 없어 보인다」는 질문에 대한 답입니다.</p>'+
  '<div class="tw"><table><thead><tr><th></th><th>렌터카 <span class="cn">自驾</span></th>'+
  '<th>전세차 <span class="cn">包车</span></th><th>패키지 <span class="cn">跟团游</span></th></tr></thead><tbody>'+
  '<tr><td>운전</td><td><b>내가 함</b></td><td>기사가 함</td><td>기사가 함</td></tr>'+
  '<tr><td>중국 면허</td><td><b>필요</b> (국제면허 불인정)</td><td>불필요</td><td>불필요</td></tr>'+
  '<tr><td>차량·기사</td><td>—</td><td>포함</td><td>포함</td></tr>'+
  '<tr><td>숙박</td><td>직접</td><td><b>직접 예약</b></td><td>포함</td></tr>'+
  '<tr><td>식사</td><td>직접</td><td><b>직접</b></td><td>대부분 포함</td></tr>'+
  '<tr><td>입장권</td><td>직접</td><td><b>직접 구매</b></td><td>포함</td></tr>'+
  '<tr><td>가이드</td><td>없음</td><td>없음 (기사만)</td><td>있음</td></tr>'+
  '<tr><td>일정</td><td>완전 자유</td><td><b>내가 정함</b></td><td>상품에 고정</td></tr>'+
  '</tbody></table></div>'+
  '<div class="msg"><p><b>정리하면</b> — 전세차는 <b>렌터카가 아닙니다.</b> 기사가 운전하므로 면허도 필요 없고, '+
  '「렌터카를 안 한다」는 방침과 충돌하지 않습니다.</p>'+
  '<p>그리고 <b>패키지와의 차이는 “누가 운전하느냐”가 아니라 “무엇까지 묶여 있느냐”입니다.</b> '+
  '전세차는 <b>차량과 기사만</b> 빌리는 것이고, 숙박·식사·입장권은 전부 따로 예약해야 합니다. '+
  '그 대가로 일정을 마음대로 짤 수 있습니다. 타고 다니는 모습만 보면 둘이 똑같아 보이는 게 맞습니다.</p></div>'+
  '<div class="msg bad"><p><b>이 여행에서는 전세차를 쓰지 않기로 했습니다.</b></p>'+
  '<p>· <b>더 비쌉니다</b> — 1인 약 68만원 대 63만원<br>'+
  '· <b>예약을 네 번 해야 합니다</b> — 차량·초원 게르·사막 숙소·입장권을 각각<br>'+
  '· <b>가이드가 없습니다</b> — 기사와 중국어로 직접 소통해야 합니다<br>'+
  '· 얻는 것은 일정 자유도뿐인데, 초원과 사막은 어차피 갈 곳이 정해져 있습니다</p></div>'+
  '<div class="msg warn"><p><b>대신 잃는 것 — 솔직하게</b></p>'+

  '후허하오터 왕복이기 때문입니다. 검증에서 「순서 2 · B경로」가 유일하게 7개 라운드를 모두 통과했는데, '+

  '<p>패키지(후허하오터 왕복)로 가면 <b>마지막 날 차량이 1.5시간에서 3시간으로 늘고</b>, '+

  '<tr><td><b>쾌적형</b> <span class="cn">舒适品质</span></td><td class="n">1,599元</td><td><b>권장</b> — 시내 4성 + 고급 게르(독립 화장실·에어컨)</td></tr>'+

  '독채 2실·3실 별장도 있어 <b>4인 가족이 한 채를 쓸 수 있습니다</b></td></tr>'+
  '<tr><td><b>싸이한지야</b><br><span class="cn">赛罕吉雅旅游景区</span></td>'+
  '<td>고급 게르 100동, 시내 3성급 기준으로 지어 2인 1실·독립 화장실·온수기·TV 완비. 규모가 커서 예약이 수월</td></tr>'+
  '<tr><td><b>시라무런 게르 리조트</b><br><span class="cn">蒙古包度假村</span></td>'+
  '<td>에어컨·독립 화장실, 서비스 평이 좋습니다. 무난한 선택</td></tr>'+
  '<tr><td><b>시라무런 게르 휴양구</b><br><span class="cn">蒙古包度假区</span></td>'+
  '<td>에어컨·독립 화장실·24시간 온수. 승마 등 초원 활동 세트권이 숙박에 묶여 나옵니다</td></tr>'+
  '</tbody></table></div>'+
  '<p style="font-size:13px;color:var(--muted)"><b>확인 필수</b> — 패키지에 포함된 게르가 어느 등급인지 반드시 물어보세요. '+

  '<div class="tw"><table><thead><tr><th>숙소</th><th class="n">성수기 요금</th><th>내용</th></tr></thead><tbody>'+
  '<tr><td><b>연꽃 호텔</b><br><span class="cn">莲花酒店 · 莲沙度假岛</span></td><td class="n">2,280~4,800元/실</td>'+
  '<td>사막 위 연꽃 모양 랜드마크, 전 객실 사막 조망. <b>일가전포</b> <span class="cn">一价全包</span> 상품이 '+
  '<b>3식 + 낙타 + 사막 질주 + 야간 파티 + 별 관측</b>까지 포함(약 2,110元/박)</td></tr>'+
  '<tr><td><b>웨사다오 텐트 캠프</b><br><span class="cn">悦沙岛帐篷营地</span></td><td class="n">중간대</td>'+
  '<td>독립 욕실·에어컨 갖춘 사막 글램핑. 연꽃 호텔보다 저렴하고 사막 체감은 더 큽니다</td></tr>'+
  '<tr><td><b>인근 시내 숙박</b><br><span class="cn">达拉特旗 · 包头</span></td><td class="n">낮음</td>'+
  '<td>비용은 크게 아끼지만 <b>사막에서 자는 경험과 별보기를 포기</b>하게 됩니다</td></tr>'+
  '</tbody></table></div>'+
  '<div class="msg warn"><p><b>비용표와의 차이</b> — 비용표의 사막 숙소 400元은 중간대 기준 추정치입니다. '+

  '다만 3식과 낙타·별 관측이 포함되므로 따로 계산하던 항목들이 흡수됩니다.</p>'+
  '<p><b>성수기에는 3주 전 예약이 필요합니다.</b></p></div>'+

  '<h3>5. 베이징 숙박 — 어느 구역에 잡느냐</h3>'+
  '<p style="font-size:13px;color:var(--muted)">특정 호텔보다 <b>구역 선택</b>이 훨씬 중요합니다. 일정에 따라 답이 다릅니다.</p>'+
  '<div class="tw"><table><thead><tr><th>구역</th><th>언제 유리한가</th><th>주의</th></tr></thead><tbody>'+
  '<tr><td><b>시즈먼 · 베이징북역</b><br><span class="cn">西直门 · 北京北站</span></td>'+
  '<td><b>순서 2·3의 8/10 밤에 최적.</b> 내몽고행 기차를 여기서 탑니다. 도착 후 바로 이동하는 날에 유리</td>'+
  '<td>관광지와는 거리가 있습니다</td></tr>'+
  '<tr><td><b>왕푸징 · 첸먼</b><br><span class="cn">王府井 · 前门</span></td>'+
  '<td>저녁 시간이 있는 날에 최적. 야시장·자금성·천안문이 도보권</td>'+
  '<td>가격대가 가장 높습니다</td></tr>'+
  '<tr><td><b>공항 접근권</b><br><span class="cn">首都机场 · 大兴</span></td>'+
  '<td><b>8/13 마지막 밤에 최적.</b> 8/14 오전 출국이라 이동 시간을 줄일 수 있습니다</td>'+
  '<td>주변에 볼거리가 없습니다</td></tr>'+
  '</tbody></table></div>'+
  '<div class="msg ok"><p><b>권장 조합</b> — 마지막 밤(8/13)만 공항 접근이 좋은 곳으로, 나머지는 시내로 잡으세요. '+
  '4인이면 <b>패밀리룸 1실</b>이나 <b>트윈 2실</b> 중 가격을 비교해 보시면 됩니다.</p></div>'+

  '<h3>6. 고속철 예매 <span class="cn">1등석</span></h3>'+
  '<div class="tw"><table><thead><tr><th>경로</th><th>장점</th><th>주의</th></tr></thead><tbody>'+
  '<tr><td><b>12306</b> 공식</td><td>가장 저렴, 좌석 선택 가능</td><td>외국인 여권 등록 절차가 번거롭고 앱이 불친절합니다</td></tr>'+
  '<tr><td><b>Trip.com</b> (携程 국제판)</td><td>한국어·영어 지원, 해외 카드 결제</td><td>수수료가 붙습니다</td></tr>'+
  '<tr><td><b>현장 창구</b></td><td>여권으로 바로 발권</td><td><b>성수기에는 매진</b>이라 사실상 불가. 비상용으로만</td></tr>'+
  '</tbody></table></div>'+
  '<div class="msg bad"><p><b>1등석은 좌석 수가 적어 2등석보다 훨씬 빨리 매진됩니다.</b> '+
  '중국 철도는 통상 출발 15일 전부터 판매하니, 날짜가 열리는 즉시 잡으세요.</p></div>'+
  '<p class="src">출처: 携程, 去哪儿网, 响沙湾 공식, 网易 여행 (2026년 7월 조회). '+
  '숙소·차량 요금은 성수기 변동제이므로 예약 시점 실제 가격을 반드시 확인하세요.</p>'}},

 move:{title:"이동 구간",body:function(){return ''+
  '<p class="lead">처음 말씀하신 <b>「베이징 → 내몽고 기차 2시간」은 맞습니다.</b> 다만 사막은 그 뒤에 붙는 별도 구간이고, 그게 짧지 않다는 점이 일정의 핵심 변수입니다.</p>'+
  '<div class="tw"><table><thead><tr><th>구간</th><th>수단</th><th class="n">소요</th></tr></thead><tbody>'+
  '<tr><td>베이징 → 후허하오터</td><td>고속철</td><td class="n">약 2~2.5시간</td></tr>'+
  '<tr><td>베이징북역 → 바오터우</td><td>고속철 G2492</td><td class="n">3시간 18분</td></tr>'+
  '<tr><td>후허하오터 → 시라무런 초원</td><td>차량 90km</td><td class="n">1.5~2시간</td></tr>'+
  '<tr><td>초원 → 샹사완</td><td>차량</td><td class="n">3~4시간</td></tr>'+
  '<tr><td><b>바오터우 → 샹사완</b></td><td>차량 45km 고속도로</td><td class="n"><b>1.5시간</b></td></tr>'+
  '<tr><td>후허하오터 → 샹사완</td><td>차량</td><td class="n">약 3시간</td></tr>'+
  '</tbody></table></div>'+
  '<div class="msg ok"><p>사막만 놓고 보면 <b>바오터우가 훨씬 가까운 관문</b>입니다. B경로가 여기서 나옵니다.</p></div>'+
  '<h3>복귀 경로 두 가지</h3>'+
  '<div class="tw"><table><thead><tr><th>방식</th><th>사막 → 베이징</th><th class="n">합계</th></tr></thead><tbody>'+
  '<tr><td>A · 후허하오터 왕복</td><td>차 3h + 고속철 2.5h</td><td class="n">약 5.5h</td></tr>'+
  '<tr><td>B · 바오터우 아웃</td><td>차 1.5h + 고속철 3.3h</td><td class="n">약 4.8h</td></tr>'+
  '</tbody></table></div>'+
  '<p>총 시간 차이는 <b>40분~1시간으로 결정적이지 않습니다.</b> 진짜 차이는 체감입니다. B는 피곤한 차량 3시간을 편한 기차 3시간 18분으로 바꿉니다. <b>이 차이가 생각보다 크게 느껴집니다.</b></p>'+
  '<div class="msg warn"><p><b>렌터카를 안 하시기 때문에</b> 초원과 사막은 선택지가 <b>현지 패키지</b> 아니면 <b>기사 포함 전세차</b> 둘뿐입니다. 대중교통으로 가려면 바오터우 시외버스터미널 → 다라터기 → 택시 환승으로 반나절이 날아갑니다.</p></div>'+
  '<p class="src">검증 출처: 高铁网, 携程, 本地宝, 响沙湾 공식 사이트 (2026년 7월 조회). 이동 시간은 낙관치가 아니라 보수치입니다. 실제 열차 시각과 요금은 12306에서 재확인하세요.</p>'}},

 warn:{title:"유의사항 · 중요도순",body:function(){return ''+
  '<p class="lead">위에서부터 처리하세요. <b>상</b>은 하나라도 놓치면 여행이 무너지는 항목입니다.</p>'+
  pri('h','상','놓치면 여행이 무너집니다',[
   ['1,000위안 이하 투어는 절대 금지','현지 업계가 공통 경고하는 저가 쇼핑투어입니다. 강제 쇼핑과 현장 추가요금으로 차액을 메워 결국 더 비싸지고 일정도 망가집니다. 정상 시세 1,200~2,800위안, 주력 1,300~1,600위안. 계약서에 순수투어 纯玩团 명시를 확인하세요.'],
   ['예산을 57만원 이상으로 다시 잡기','1인 30만원으로는 고속철 1등석 왕복과 투어비만으로 이미 초과됩니다. 예산을 고수하면 위의 저가투어 함정에 그대로 걸립니다.'],
   ['지금 바로 예약 (8월 최성수기)','8월 중순은 내몽고 최성수기입니다. 좋은 게르와 정상 패키지는 이미 차고 있고, 직전 예약은 가격이 급등합니다.'],
   ['알리페이 / 위챗페이 해외카드 등록','현금과 해외 신용카드는 거의 안 통합니다. 결제 수단이 없으면 현지에서 아무것도 못 합니다. 한국에서 미리 등록하고 테스트하세요.'],
   ['무비자 정책 유효 여부 재확인','한국인 무비자 정책이 2026년 8월 시점에 유효한지 반드시 확인하세요. 틀리면 출발 자체가 불가능합니다.'],
   ['12306 기차표 조기 확보','성수기 매진 위험이 큽니다. 1등석은 좌석 수가 적어 더 빨리 나갑니다. 외국인 여권 예매 절차와 현장 수령 방식을 미리 확인하세요.']
  ])+
  pri('m','중','불편하거나 손해를 봅니다',[
   ['8/10 도착 시각 확인','<b>순서 2·3은 15시 이전 도착이 조건입니다.</b> 늦으면 후허하오터행 막차를 놓쳐 순서 1로 강제됩니다. 안을 고르기 전에 가장 먼저 확인할 사항입니다.'],
   ['일교차 대비 방한 겉옷','사막 낮은 40℃ 근접, 밤은 15℃ 이하입니다. 8월이라고 여름옷만 챙기면 밤에 고생합니다.'],
   ['통신 (VPN 또는 로밍)','구글·카카오가 차단됩니다. 한국에서 미리 설정하지 않으면 현지에서 설치조차 어렵습니다.'],
   ['게르 등급 확인','경제형은 공용 화장실, 쾌적형은 독립 화장실·에어컨입니다. 편의를 생각하면 쾌적형을 권합니다.'],
   ['달 위상 확인','달이 밝으면 유성우 관측 조건이 크게 나빠집니다. 이 여행의 하이라이트가 걸려 있습니다.'],
   ['가족 간 기대치 합의','순서 1·2는 만리장성이 빠지고, 순서 3은 유성우와 초원 게르가 빠집니다. 출발 전에 무엇을 포기하는지 합의해 두세요.']
  ])+

function open_(k){
  var s=SHEET[k]; if(!s) return; curSheet=k;
  document.getElementById('sh-title').textContent=s.title;
  var b=document.getElementById('sh-body'); b.innerHTML=s.body(); b.scrollTop=0;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('scrim').classList.add('show');
  if(innerWidth<=820) document.getElementById('side').classList.remove('open');
}
function close_(){curSheet=null;
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('scrim').classList.remove('show')}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if(document.getElementById('sheet').classList.contains('show')) close_(); else if(cur) reset()});
